name: Pages Workflow
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Inject
        env:
          A70EE8: ${{ secrets.A70EE8 }}
          BB44CD: ${{ secrets.BB44CD }}
        run: |
          python3 -c "
          import os, pathlib, sys
          gm = os.environ.get('A70EE8', '')
          bm = os.environ.get('BB44CD', '')
          p = pathlib.Path('index.html')
          s = s2 = p.read_text(encoding='utf-8')
          if gm:
              s2 = s2.replace('<!-- 110c427ffdb4793cb52381099de8612afd -->', gm)
          if bm:
              s2 = s2.replace('<!-- 5fd4b139a3f26e0dd4da -->', bm)
          if s2 == s and (gm or bm):
              sys.exit(1)
          if s2 != s:
              p.write_text(s2, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
